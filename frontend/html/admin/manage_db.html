<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker | Manage Database</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">ADMIN <span style="font-weight: 300;">| DB Manager</span></div>
            <div>
                <a href="/admin/dashboard.html" class="nav-link">Dashboard</a>
                <a href="tracker.html" class="nav-link">View Tracker</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Content Inventory</h1>
            <p>Directly modify, add, or remove media items from the PostgreSQL database.</p>
        </section>

        <div class="feature-card" style="margin-bottom: 40px;">
            <h3>Quick Add Entry</h3>
            <form id="admin-add-form" style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; margin-top: 15px;">
                <input type="text" class="form-input" placeholder="Title (e.g. Bleach)" required>
                <select class="form-input" style="background-color: #121212;">
                    <option value="Anime">Anime</option>
                    <option value="Manga">Manga</option>
                    <option value="Movie">Movie</option>
                    <option value="TV Show">TV Show</option>
                </select>
                <button type="submit" class="btn-main" style="padding: 10px 25px;">Add to DB</button>
            </form>
        </div>

        <div class="stat-card">
            <h3>Current Inventory</h3>
            <div style="overflow-x: auto; margin-top: 20px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="border-bottom: 2px solid #333;">
                        <tr>
                            <th style="padding: 12px;">ID</th>
                            <th style="padding: 12px;">Title</th>
                            <th style="padding: 12px;">Type</th>
                            <th style="padding: 12px;">Status</th>
                            <th style="padding: 12px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="db-inventory-body">
                        <tr>
                            <td colspan="5" style="padding: 30px; text-align: center; color: var(--text-muted);">
                                Loading inventory data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="container" style="text-align: center; margin-top: 50px; opacity: 0.6;">
        <p>Database Management Module | Secure Admin Session</p>
    </footer>
</body>
</html>
