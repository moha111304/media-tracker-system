<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker | Analytics</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">MediaTracker</div>
            <div>
                <a href="tracker.html" class="nav-link">Tracker</a>
                <a href="login.html" class="nav-link">Login</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Media Insights</h1>
            <p>A high-level view of your collection progress.</p>
        </section>

        <div id="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px;">
            <div class="feature-card">
                <h3>Total Entries</h3>
                <p class="stat-number" style="font-size: 2.5rem; color: var(--accent-color); font-weight: bold;">--</p>
            </div>
            <div class="feature-card">
                <h3>Completed</h3>
                <p class="stat-number" style="font-size: 2.5rem; color: var(--accent-color); font-weight: bold;">--</p>
            </div>
            <div class="feature-card">
                <h3>Mean Rating</h3>
                <p class="stat-number" style="font-size: 2.5rem; color: var(--accent-color); font-weight: bold;">--</p>
            </div>
        </div>

        <section style="margin-top: 40px; text-align: center;">
            <a href="tracker.html" class="btn-main" style="text-decoration: none; display: inline-block;">← Back to Tracker</a>
        </section>
    </main>

    <footer class="container" style="text-align: center; margin-top: 50px; color: var(--text-muted);">
        <p>&copy; 2026 Media Tracker System | Analytics </p>
    </footer>
</body>
</html>
