<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker | Login</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">MediaTracker</div>
            <a href="/" class="nav-link">← Back to Home</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero" style="padding: 40px 0;">
            <h1>Login</h1>
            <p>Access your personal media collection.</p>
            
            <form id="login-form" class="feature-card" style="max-width: 400px; margin: 0 auto; text-align: left;">
                <div style="margin-bottom: 15px;">
                    <label for="email" style="display: block; margin-bottom: 5px;">Email</label>
                    <input type="email" id="email" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); background: #121212; color: white;" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label for="password" style="display: block; margin-bottom: 5px;">Password</label>
                    <input type="password" id="password" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); background: #121212; color: white;" required>
                </div>
                <button type="submit" class="btn-main" style="width: 100%; border: none; cursor: pointer;">Sign In</button>
            </form>

            <p style="margin-top: 20px;">Don't have an account? <a href="#" style="color: var(--accent-color);">Sign up here</a></p>
        </section>
    </main>

    <footer class="container" style="text-align: center; margin-top: 50px;">
        <p>&copy; 2026 Media Tracker System</p>
    </footer>
</body>
</html>
