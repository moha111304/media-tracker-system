<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker | My List</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <h1>My Collection</h1>
    <div id="media-grid" class="media-grid">
        </div>

    <script>
        async function fetchMedia() {
            const grid = document.getElementById('media-grid');
            try {
                const response = await fetch('/media');
                const data = await response.json();

                grid.innerHTML = data.map(item => `
                    <div class="media-card" onclick="alert('Title: ${item.title}')">
                        <img src="${item.image_url || 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${item.title}">
                        <div class="card-info">
                            <div class="card-title">${item.title}</div>
                            <div style="font-size: 0.8rem;">${item.current_progress} / ${item.total_episodes}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                grid.innerHTML = `<p style="color: red;">Failed to load media.</p>`;
            }
        }
        window.onload = fetchMedia;

        <div id="add-media-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content feature-card">
                <div class="modal-header">
                    <h2>Add New Media</h2>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
                <form id="add-media-form">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="new-title" class="form-input" placeholder="e.g. Blue Lock" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Type</label>
                            <select id="new-type" class="form-input">
                                <option value="Anime">Anime</option>
                                <option value="Manga">Manga</option>
                                <option value="Manhwa">Manhwa</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Total Episodes</label>
                            <input type="number" id="new-total" class="form-input" placeholder="12" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Poster Image URL</label>
                        <input type="url" id="new-image" class="form-input" placeholder="https://...">
                    </div>
                    <button type="submit" class="btn-main" style="width: 100%; margin-top: 10px;">Save to Collection</button>
                </form>
            </div>
</div>
    </script>
</body>
</html>
