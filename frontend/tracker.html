<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker | My List</title>
    <style>
        /* Basic CSS to make the table scale */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        
        /* Responsive: Hide Rating and Date on small screens */
        @media screen and (max-width: 600px) {
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div> <h1>My Media Collection</h1>

    <table id="media-table">
        <thead>
            <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Status</th>
                <th>Progress</th>
                <th class="hide-mobile">Rating</th>
                <th class="hide-mobile">Updated</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>

    <script>
        // SKELETON JAVASCRIPT
        // This function will eventually fetch data from Node.js API
        async function loadMedia() {
            console.log("Fetching media from API...");
            // TODO: const response = await fetch('http://localhost:5001/media');
            // TODO: const data = await response.json();
            
            const tableBody = document.getElementById('table-body');
            
            // Placeholder Row
            tableBody.innerHTML = `
                <tr>
                    <td>Example Anime</td>
                    <td>Anime</td>
                    <td>Watching</td>
                    <td>05/24</td>
                    <td class="hide-mobile">8/10</td>
                    <td class="hide-mobile">2026-01-28</td>
                </tr>
            `;
        }

        // Run when page loads
        window.onload = loadMedia;
    </script>
</body>
</html>
