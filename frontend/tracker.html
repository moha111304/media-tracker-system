<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker | My List</title>
    <style>
    /* The Grid Container */
    .media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 25px;
        padding: 20px 0;
    }

    /* Individual Card */
    .media-card {
        background: #1e1e1e;
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.2s;
        cursor: pointer;
        position: relative;
        aspect-ratio: 2 / 3; /* Keeps the poster shape */
    }

    .media-card:hover { transform: scale(1.05); }

    .media-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* Info Overlay (Visible on Hover/Click) */
    .card-info {
        position: absolute;
        bottom: 0;
        background: rgba(0, 0, 0, 0.85);
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    .card-title { font-weight: bold; font-size: 0.9rem; color: #03dac6; }
</style>

<body>
    <h1>My Collection</h1>
    <div id="media-grid" class="media-grid">
        </div>

    <script>
        async function fetchMedia() {
            const grid = document.getElementById('media-grid');
            try {
                const response = await fetch('/media');
                const data = await response.json();

                grid.innerHTML = data.map(item => `
                    <div class="media-card" onclick="alert('Title: ${item.title}')">
                        <img src="${item.image_url || 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${item.title}">
                        <div class="card-info">
                            <div class="card-title">${item.title}</div>
                            <div style="font-size: 0.8rem;">${item.current_progress} / ${item.total_episodes}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                grid.innerHTML = `<p style="color: red;">Failed to load media.</p>`;
            }
        }
        window.onload = fetchMedia;
    </script>
</body>
</html>
